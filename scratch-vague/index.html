<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="calculator">
        <div id="calculator-interface">
            <div id="calculator-screen">
                <div id="nums-top">
                    <div id="screen-top">
                        <span id="screen-top-display"></span>
                    </div>
                </div>
                <div id="nums-bottom">
                    <div id="screen-bottom">
                        <span id="screen-bottom-display">0</span>
                    </div>
                </div>
            </div>

            <div id="functional-container">
                <div class="button" id="clear-all">AC</div>
                <div class="button" id="del">DEL</div>
                <div class="button" id="percent">%</div>
                <div class="button" id="divide">/</div>
            </div>

            <div id="nums-container">
                <div class="numbers-line">
                    <div class="button number" id="7">7</div>
                    <div class="button number" id="8">8</div>
                    <div class="button number" id="9">9</div>
                </div>
                <div class="numbers-line">
                    <div class="button number" id="4">4</div>
                    <div class="button number" id="5">5</div>
                    <div class="button number" id="6">6</div>
                </div>
                <div class="numbers-line">
                    <div class="button number" id="1">1</div>
                    <div class="button number" id="2">2</div>
                    <div class="button number" id="3">3</div>
                </div>
                <div class="numbers-line">
                    <div class="button number" id="0">0</div>
                    <div class="button number" id="00">00</div>
                    <div class="button number" id="decimal">.</div>
                </div>
            </div>

            <div id="arithmetic-container">
                <div class="button arithmetic" id="multiply">&times;</div>
                <div class="button arithmetic" id="subtract">&minus;</div>
                <div class="button arithmetic" id="add">+</div>
                <div class="button arithmetic" id="equal">=</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
